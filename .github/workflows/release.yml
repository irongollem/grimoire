name: Test and release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the automatic GITHUB_TOKEN. No job writes to the repo;
# production credentials come from secrets, not from this token.
permissions:
  contents: read

# A newer push to the same PR makes the older run pointless (Dependabot
# rebases its PR on every main merge), so PR runs cancel their predecessor.
# A push to main is NEVER cancelled: each one may carry migrations, and the
# release jobs below also queue on their own `supabase-production` group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  application:
    name: Application — lint, tests, build
    runs-on: ubuntu-latest
    # Ceilings, not estimates (these jobs take 2–7 minutes): the default is six
    # hours, and a hung `supabase start` or deploy would sit on it.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint (oxlint)
        run: npm run lint
      # Import cycles and layer rules (lib below composables and stores; stores
      # below composables), as errors since #999 story 5.1: a new one fails
      # here instead of accumulating until someone measures again.
      - name: Import graph (dependency-cruiser)
        run: npm run arch:graph
      - name: Unit tests (vitest)
        run: npm test
      - name: Typecheck and build (vue-tsc, vite)
        run: npm run build
      # Reads dist/, so it has to follow the build. Catches the class of break
      # that took /login down in #896: a dependency calling a runtime API that
      # older browsers lack. No build target polyfills those, and every gate
      # above runs on Node, which has all of them — so nothing else here can
      # see it. Gates on the set of API *names*, not on counts, so a known
      # false positive is triaged once in pinned.mjs rather than argued about
      # on every build.
      - name: Runtime APIs older browsers lack
        run: npm run check:runtime-apis

  # Everything that needs a real Postgres: the migration-version guard, a
  # full replay of every migration, pgTAP, the embed check, the content-
  # integrity self-test and the spell concurrency test. Called
  # `spell-database` until 19 Sep 2026, after the spell test it started as.
  database:
    name: Database — migrations, pgTAP, integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        # Full history: the version guard below compares this branch's
        # migrations against origin/main, and the default shallow clone has no
        # origin/main to compare against — it would skip its most important
        # check and pass in silence.
        with:
          fetch-depth: 0
      # Cheap, and it runs BEFORE the database starts: both failures it catches
      # are filename arithmetic, and there is no reason to spend two minutes on
      # Postgres to find out a version number collides. See the tool for the
      # production incidents that justify it.
      #
      # Bare `node`, no setup-node and no `npm ci`: the tool has no dependencies
      # precisely so it can run here, before anything is installed, and in a
      # pre-push hook. Adding an install step to this job would cost more than
      # the check it guards.
      - name: Migration versions are unique and newer than main
        run: node scripts/migration-rebase/cli.mjs --check
      # Pinned to a commit SHA, not the moving `v3` tag: it is the one
      # third-party action here, and in production-release it runs in the same
      # job as SUPABASE_ACCESS_TOKEN and the production DB password. Dependabot
      # (github-actions ecosystem) still proposes updates to the SHA.
      #
      # setup-cli v3 installs the CLI from the npm `supabase` package rather
      # than a GitHub release, so a version pinned here must exist on npm — the
      # two publication streams are not guaranteed to carry the same tags. It
      # also dropped the `github-token` input, which this repo never passed.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.109.1
      - name: Replay every migration into a fresh database
        run: supabase start
      - name: Database tests (pgTAP — RLS, RPCs, triggers)
        run: supabase test db
      # Asks a real PostgREST to resolve every embed the app ships. Nothing else
      # in CI talks to PostgREST, so an ambiguous embed typechecks, lints and
      # unit-tests clean while answering 300 to every caller in production —
      # which is exactly what #728 did, undetected, until a log trawl found it.
      # The ambiguity is a property of the schema, so this guards code nobody
      # touched: an unrelated new table can break a query that was always fine.
      - name: PostgREST embeds are unambiguous
        run: sh scripts/check-embeds.sh
      # The deploy gate is itself code, and it has been wrong in both
      # directions: it missed nine live referrers (#553 stranded 33 references
      # through that gap), and a later version counted a valid note on a shared
      # item as dangling — a false positive there fails the release and strands
      # every migration queued behind it. This plants damage and requires the
      # gate to catch it, then plants valid rows and requires silence.
      - name: Self-test the content-integrity gate
        run: sh scripts/test-content-integrity.sh
      - name: Spell transactions under concurrency
        run: scripts/test-spell-concurrency.sh

  # Load performance, measured in a real browser against the production build
  # and the replayed schema (epic #999). Two things come out of it, and both
  # exist because a one-off measurement does not protect an improvement:
  #
  #   1. A gate. `check-budgets` fails the job when a journey makes more API
  #      requests, or waits through more serial round trips, than
  #      scripts/perf/budgets.json allows. Only those two counts are gated:
  #      they were identical across every local run, whereas times and bytes
  #      move with the runner. The boot-bundle size has its own gate at build
  #      time (bootBudgetPlugin in vite.config.ts), so it is not repeated here.
  #   2. A history. On main, one line per release is appended to history.jsonl
  #      on the orphan `perf-history` branch, so the trend of the timings can be
  #      read later (`scripts/perf/history.ts summarize`).
  #
  # Advisory for now (maintainer's call, 7 Oct 2026): nothing needs this job,
  # so a breach or a flaky run never blocks a release. The budget step reports
  # over-budget numbers as a failed step and in the summary; the boot-bundle
  # budget, checked inside `npm run build`, stays a hard gate. Promote this job
  # into the release jobs' `needs` once it has run stably for a while.
  #
  # The journeys sign in as two synthetic accounts that `npm run perf:fixture`
  # creates (scripts/perf/fixture.ts), so the numbers mean the same thing here
  # as on a laptop: supabase/seed.sql is a gitignored dump of real data and
  # does not exist in CI.
  performance:
    name: Performance — journeys, budgets, history
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only like every job that installs dependencies: npm ci, the build and
    # the harness run third-party code, which must never hold a token that can
    # push. Writing the history is the separate job below.
    outputs:
      history: ${{ steps.entry.outputs.history }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for the harness
        run: npx playwright install --with-deps chromium
      # Same pin as the database job; see the note there.
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.109.1
      # Replays every migration. The data the journeys load is not from a seed
      # (the real-data dump is not in the repo): the next step creates it.
      - name: Start the local stack
        run: supabase start
      - name: Create the synthetic fixture
        run: npm run perf:fixture
      # The empty token is required, not decoration: without it the build
      # tries to upload source maps to Sentry. No vue-tsc: the application job
      # already typechecks, and only the bundle matters here. This build still
      # runs bootBudgetPlugin, so the boot-size gate applies.
      - name: Build against the local stack
        run: SENTRY_AUTH_TOKEN= npx vite build --mode localdb
      - name: Serve the build
        run: |
          nohup npx vite preview --mode localdb --host 127.0.0.1 --port 4173 --strictPort > preview.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:4173/; then exit 0; fi
            sleep 1
          done
          echo "::error::vite preview did not come up on 127.0.0.1:4173"
          cat preview.log
          exit 1
      # One run is enough for the gate (the counts do not vary); main takes
      # three so the timings recorded in the history are medians.
      - name: Run the journeys
        id: journeys
        run: |
          # A pipe hides the harness's exit status from `bash -e`.
          set -o pipefail
          npx tsx scripts/perf/run.ts --runs ${{ github.event_name == 'push' && 3 || 1 }} --out perf-results/ci.json | tee perf-results.log
          {
            echo '```'
            sed -n '/^journey/,/^wrote/p' perf-results.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report the critical-path size
        run: npx tsx scripts/perf/bundle/critical-path.ts dist --json perf-results/critical-path.json
      - name: Check the request budgets (advisory)
        continue-on-error: true
        run: npx tsx scripts/perf/check-budgets.ts perf-results/ci.json
      # The history line is written here, where the results are, and handed to
      # performance-history as an artifact. Recorded even when a budget fails:
      # a regression is exactly the data point the trend should show.
      - name: Prepare the history line (main only)
        id: entry
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.journeys.outcome == 'success'
        run: |
          npx tsx scripts/perf/history.ts entry perf-results/ci.json --sha "$GITHUB_SHA" --critical perf-results/critical-path.json > perf-results/entry.json
          echo "history=ready" >> "$GITHUB_OUTPUT"
      - name: Hand the history line on
        if: always() && steps.entry.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: perf-history-entry
          path: perf-results/entry.json
          retention-days: 1

  # Appends the performance job's line to history.jsonl on the orphan
  # `perf-history` branch. The only job with write access to the repo, so it
  # installs nothing and runs nothing from npm: a shell script and git. Nothing
  # needs it, and a failure here loses one data point, never a release.
  performance-history:
    name: Performance — record history
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.performance.outputs.history == 'ready'
    needs: [performance]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: perf-history-entry
          path: perf-results
      - name: Append to history.jsonl
        run: sh scripts/perf/publish-history.sh perf-results/entry.json

  release-changes:
    name: Detect backend changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      supabase: ${{ steps.changes.outputs.supabase }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The push may contain several commits; the before SHA must be
          # available so path detection covers the complete push.
          fetch-depth: 0

      - name: Did this push change migrations or Edge Functions?
        id: changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- .github/workflows/release.yml supabase/migrations supabase/functions supabase/config.toml; then
            echo "supabase=false" >> "$GITHUB_OUTPUT"
          else
            echo "supabase=true" >> "$GITHUB_OUTPUT"
          fi

  # Production changes are deliberately released from the same workflow as the
  # required application/database gates. Keeping migrations and Edge Functions
  # in one job guarantees that a function bundle can never reach production
  # before the schema it depends on.
  production-release:
    name: Release backend — migrations, Edge Functions
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-changes.outputs.supabase == 'true'
    needs: [application, database, release-changes]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.PRODUCTION_PROJECT_ID }}
      # Lifted to job env so the steps below can branch on whether it is set.
      # `secrets` is NOT a valid context inside `if:` — GitHub rejects the whole
      # file with "Unrecognized named-value: 'secrets'", which does not fail the
      # run so much as prevent it: zero jobs, zero logs, and a generic "workflow
      # file issue". `env` IS valid in a step-level `if:`, so the skip-when-unset
      # behaviour survives intact.
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.109.1

      # Stripe's webhook configuration lives in Stripe, not in this repo, and
      # test mode is a separate copy of it — so "it passed in test mode" says
      # nothing about live. A missing event raises no error anywhere; it just
      # means a handler never runs and a paying customer gets nothing. Three
      # were missing on 2026-08-01, including the one that grants PRO.
      #
      # Deliberately before `db push`: a config mismatch should fail while
      # production is still untouched, not after migrations have landed.
      - uses: actions/setup-node@v7
        if: env.STRIPE_SECRET_KEY != ''
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies (for the Stripe check)
        if: env.STRIPE_SECRET_KEY != ''
        run: npm ci
      - name: Stripe webhook configuration matches the code
        if: env.STRIPE_SECRET_KEY != ''
        run: npm run stripe:check

      # Loud rather than silent: a check that quietly does not run is worse than
      # no check, because the release still looks green.
      - name: Warn that the Stripe check was skipped
        if: env.STRIPE_SECRET_KEY == ''
        run: |
          echo "::warning::STRIPE_SECRET_KEY is not set, so the Stripe webhook configuration was NOT verified. Add it to the repository secrets (a restricted key with read access to webhook endpoints is enough) so config drift fails the release instead of a customer's payment."

      - name: Link the Supabase CLI to production
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Apply migrations to production
        run: supabase db push

      # A data migration that strands text-id references to shared content
      # (the #553 "Unknown creature" class) fails the release here instead of
      # surfacing as a player report.
      - name: Content-integrity gate (production)
        run: |
          payload=$(jq -Rs '{query: .}' < supabase/checks/content_integrity.sql)
          result=$(curl -sf -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload")
          echo "$result"
          # The query API answers 200 with an error *object* for some failures.
          # Without this guard `jq length` counts that object's keys and reports
          # an API or auth outage as dangling content references — a data alarm
          # for an infrastructure problem, sending the reader to the wrong file.
          if ! echo "$result" | jq -e 'type == "array"' > /dev/null; then
            echo "::error::Content integrity check could not run: the query API returned something other than a result array (see above). This is an API/auth failure, not a data problem."
            exit 1
          fi
          violations=$(echo "$result" | jq 'length')
          if [ "$violations" != "0" ]; then
            echo "::error::Dangling shared-content references after migration — see rows above (supabase/checks/content_integrity.sql)"
            exit 1
          fi

      # Deploy every function after any Supabase production change. Besides
      # handling shared modules and dependency locks safely, this means a newer
      # queued release fully subsumes an older queued release that GitHub's
      # concurrency control may replace. Do not add --prune: production may
      # contain intentionally remote-only functions.
      #
      # No --import-map flag: the CLI stopped honouring it ("Specifying
      # import_map through flags is no longer supported") and finds
      # supabase/functions/deno.json on its own. Passing it was a silent no-op —
      # confirmed by the failure below, which resolved the *bare* specifier
      # `@supabase/supabase-js` to its mapped esm.sh URL while the flag was
      # already being ignored.
      #
      # Retried because bundling resolves every dependency over the network at
      # deploy time (esm.sh, deno.land), so a CDN blip fails the whole release.
      # Not hypothetical: run 30668249029 died on a 522 from esm.sh *after*
      # `db push` had already succeeded, leaving production schema ahead of
      # function code with no rollback. Retrying closes the common case. The
      # skew window itself is inherent to deploying schema and code in two
      # steps, and is why the error below says so out loud.
      #
      # Bundling runs in the CLI's edge-runtime image, which it pulls from
      # public.ecr.aws by default. ECR Public caps anonymous pulls by data per
      # source IP, and GitHub's runners share their IPs, so on 30 Sep 2026 run
      # 36786738781 failed all three attempts on "toomanyrequests: Data limit
      # exceeded" after `db push` had applied, and the frontend release was
      # skipped. The same image is published to ghcr.io, which GitHub's own
      # runners reach without that cap. (`--use-api` would avoid Docker
      # entirely, but server-side bundling caps a function at 5 MB, not 20, and
      # cannot ship static files.)
      - name: Deploy Edge Functions to production
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
        run: |
          for attempt in 1 2 3; do
            if supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::Edge Function deploy attempt $attempt failed; retrying in $((attempt * 15))s"
              sleep $((attempt * 15))
            fi
          done
          echo "::error::Edge Function deploy failed after 3 attempts. Migrations from this release are already applied, so production schema is now ahead of the deployed function code — re-run this job before assuming the release landed."
          exit 1

  # The frontend ships LAST, from the commit this workflow tested, after the
  # schema and functions it calls are live. Vercel's own Git integration used
  # to deploy `main` on push, in parallel with production-release, and that
  # race is not theoretical: on 18 Sep 2026 the new import review shipped
  # minutes before the `import-match` function it calls (every DM got a 404),
  # and a page pasted in that window was extracted with the previous prompt
  # (the new one landed 98 seconds later) — and #649 shipped against a schema
  # that never got its migration on 9 Aug. So `vercel.json` turns off the Git
  # integration's production deploys for `main`, and this is the only door.
  #
  # Runs when production-release succeeded OR was skipped (a push with no
  # Supabase changes has nothing to wait for) — never after it failed, which
  # would put a frontend in front of a half-released backend. `always()` is
  # what lets a skipped dependency through at all.
  #
  # Same concurrency group as production-release, never cancelled: releases
  # queue behind each other, so an older run can't deploy over a newer one.
  #
  # `vercel pull` fetches the project's production env vars and build settings
  # into .vercel/, `vercel build --prod` builds this exact checkout with them,
  # and `--prebuilt` uploads that output rather than letting Vercel rebuild
  # whatever `main` points at by then (which a deploy hook would do).
  frontend-release:
    name: Release frontend — Vercel
    if: >-
      always()
      && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.application.result == 'success'
      && needs.database.result == 'success'
      && (needs.production-release.result == 'success' || needs.production-release.result == 'skipped')
    needs: [application, database, release-changes, production-release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Records each release on GitHub's Production deployments page. Vercel's own
    # GitHub app only reports deploys it triggers from Git, and those stopped
    # for main on 19 Sep (ba4f5838), so without this the page froze there while
    # production kept moving. The environment has no protection rules: this
    # adds a record, not an approval step.
    environment:
      name: Production
      url: https://app.dungeongrimoire.com
    concurrency:
      group: supabase-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Not a secret — a team slug is in every Vercel URL.
      VERCEL_TEAM_SLUG: irongollem-3997s-projects
    steps:
      # Fails the release loudly rather than skipping: once Vercel's Git
      # deploys are off, a missing secret here means nothing ships at all.
      - name: Check the Vercel credentials
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set in the repository secrets. Once Vercel's Git deploys for main are off (vercel.json), the frontend is never released without it."
              exit 1
            fi
          done
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install the Vercel CLI
        run: npm install --global vercel@58
      # Diagnostic only, and never fatal — but read its output before anything
      # else when this job goes red. `whoami` asks which USER the token belongs
      # to, and a PROJECT-scoped token has no answer: Vercel documents it as
      # denying "any request to another project, to a user-level resource, or
      # to a team-level resource". The CLI resolves the user on EVERY command,
      # so a project-scoped token does not merely fail `whoami` — it fails
      # `pull`, `build` and `deploy` too, all with "User not found. (404)".
      # VERCEL_TOKEN must therefore be a TEAM- or account-scoped token
      # (vercel.com/account/tokens → Scope → the team → All Projects). Verify a
      # new one with `vercel whoami --token=…` locally before setting it here:
      # if it prints a username, this job will work.
      - name: Whose token is this? (diagnostic)
        continue-on-error: true
        run: vercel whoami --token="$VERCEL_TOKEN"
      # --scope and --project rather than relying on VERCEL_ORG_ID /
      # VERCEL_PROJECT_ID being picked up implicitly: the env-var form links a
      # directory that has no `.vercel/` yet, and on a bare CI checkout that is
      # exactly the case that failed. The ids stay in secrets; only how they
      # reach the CLI changes.
      #
      # --scope takes the team SLUG here, not the team id: a project-scoped
      # token resolves its own team, and the slug is what the CLI matches
      # against. --project takes the project id from the secret.
      - name: Pull Vercel's production settings and env
        run: vercel pull --yes --environment=production --scope="$VERCEL_TEAM_SLUG" --project="$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN"
      - name: Build with the production env
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy to Vercel production
        # --archive=tgz uploads the build as one archive instead of file by
        # file. Without it every content-hashed asset is its own upload, and
        # the free plan allows 5,000 a day: on 27 Sep 2026 two releases in a
        # row died with "Too many requests (api-upload-free)" after a busy day
        # of deploys, the self-hosted @fontsource files adding ~1,100 more.
        run: vercel deploy --prebuilt --archive=tgz --prod --scope="$VERCEL_TEAM_SLUG" --token="$VERCEL_TOKEN"
