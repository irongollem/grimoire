name: Validate Supabase Migrations

# On every PR that touches a migration, boot a throwaway local Postgres and
# apply all migrations from scratch. Production deployment lives in test.yml so
# application checks, database checks, migrations, and Edge Functions form one
# ordered release gate.

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 2.109.1

      # `db start` boots the local Postgres and applies all migrations in order;
      # a broken migration fails the step, blocking the merge.
      - name: Apply migrations to a throwaway local DB
        run: supabase db start
