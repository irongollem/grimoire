name: Application and Spell Rules

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run build

  spell-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start migrated local database
        run: supabase start
      - name: Direct API and transaction rules
        run: supabase test db
      - name: Concurrent spell transactions
        run: scripts/test-spell-concurrency.sh
