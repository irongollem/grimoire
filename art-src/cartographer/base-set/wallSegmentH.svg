<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- The band is the whole tile's content: 25% of a cell, centred on the
       gridline, running edge to edge. Crisp boundary lines top and bottom so a
       restyle keeps the band's thickness rather than feathering it outward. -->
  <defs>
    <linearGradient id="band" x1="0" y1="384" x2="0" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b6b6b6"/><stop offset=".45" stop-color="#909090"/><stop offset="1" stop-color="#6b6b6b"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="468.5" x2="0" y2="555.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d0d0d0"/><stop offset="1" stop-color="#888888"/>
    </linearGradient>
    <linearGradient id="shut" x1="0" y1="404" x2="0" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#cfcfcf"/><stop offset="1" stop-color="#8a8a8a"/>
    </linearGradient>
  </defs>
  <g>
    <rect x="0" y="384" width="1024" height="256" fill="url(#band)"/>
    <line x1="0" y1="387" x2="1024" y2="387" stroke="#ffffff" stroke-opacity=".30" stroke-width="6"/>
    <line x1="0" y1="637" x2="1024" y2="637" stroke="#1e1e1e" stroke-opacity=".45" stroke-width="6"/>
  </g>
</svg>
