<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f2ebe0" />
    <!-- viewport-fit=cover lets the app extend into the notch / home-indicator
         safe areas; individual components opt in via pt-safe / pb-safe /
         pr-safe / pl-safe utilities (see main.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dungeon Grimoire</title>
    <meta name="description" content="D&D campaign manager for Dungeon Masters and players" />
    <!-- @page must be in the static HTML head — Safari ignores @page rules
         injected later by JS/component stylesheets -->
    <style>
      @page {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- Vercel Web Analytics (#645). Loaded as a script rather than via
         @vercel/analytics because every stable release of that package still
         declares a `vue-router@^4` peer and this app is on 5 — the package
         would need a forced override to install, for an integration we would
         not use anyway.

         No cookie and no device storage, so ePrivacy Art. 5(3) never engages
         and this needs no consent banner. Cookieless is the whole reason this
         was chosen over a tool with funnels; see issue #645.

         beforeSend reduces every URL to its route *shape* before it leaves the
         browser. Grimoire's paths carry entity ids (/campaign/<uuid>/npc/<uuid>)
         and its search params carry whatever the user typed, none of which
         belongs in an analytics product — and unreduced ids would fragment the
         report into one row per entity regardless. This mirrors what the Sentry
         integration already does to URLs (#644). -->
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
      window.va("beforeSend", function (event) {
        try {
          var url = new URL(event.url);
          return {
            ...event,
            url:
              url.origin +
              url.pathname
                .replace(
                  /\/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?=\/|$)/gi,
                  "/:id",
                )
                // Shared-library rows are text ids (srd_owlbear), not uuids.
                .replace(/\/srd_[^/]+(?=\/|$)/gi, "/:id"),
          };
        } catch {
          // An unparseable URL is not worth reporting a shape for.
          return null;
        }
      });
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
