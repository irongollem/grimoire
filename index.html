<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f2ebe0" />
    <!-- viewport-fit=cover lets the app extend into the notch / home-indicator
         safe areas; individual components opt in via pt-safe / pb-safe /
         pr-safe / pl-safe utilities (see main.css). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dungeon Grimoire</title>
    <meta name="description" content="D&D campaign manager for Dungeon Masters and players" />

    <!-- Share/unfurl tags. Deliberately generic: vercel.json rewrites every
         path to this one file, and no unfurler runs the JS that would set
         per-route tags, so the whole subdomain shares a single card. The link
         that makes this worth having is /join/<token>, which is what a DM
         pastes into Discord to invite players; without these it expands to
         nothing.

         og:image points at the marketing site's card rather than a copy of it,
         so regenerating it there (npm run og) updates this too and the two can
         never drift apart. Cross-origin image URLs are fine for Open Graph.

         Note there is no `robots: noindex` meta here on purpose: the app is
         already kept out of search by robots.txt, and it is not settled that
         every card fetcher ignores noindex, so adding one risks suppressing
         the previews this exists to produce. -->
    <meta property="og:site_name" content="Dungeon Grimoire" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dungeon Grimoire" />
    <meta property="og:description" content="D&D campaign manager for Dungeon Masters and players. Free to start, and always free for your players." />
    <meta property="og:image" content="https://dungeongrimoire.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dungeon Grimoire: the all-in-one D&D 5e toolkit for Dungeon Masters" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dungeon Grimoire" />
    <meta name="twitter:description" content="D&D campaign manager for Dungeon Masters and players. Free to start, and always free for your players." />
    <meta name="twitter:image" content="https://dungeongrimoire.com/og.png" />
    <!-- @page must be in the static HTML head — Safari ignores @page rules
         injected later by JS/component stylesheets -->
    <style>
      @page {
        margin: 0;
      }
    </style>
  </head>
  <body>
    <!-- Static boot splash (27 Sep 2026). The loading screen is a Vue
         component (LoadingScreen.vue), so it could only appear once the whole
         bundle had downloaded, run and routed. On a cold start or a PWA
         resume that wait is the blank white screen the loading screen exists
         to cover. This copy is plain HTML, painted at once; Vue replaces the
         contents of #app when it mounts, and App.vue shows the real loading
         screen, drawn identically, from there. Its colours come from the last
         theme the app applied (useTheme.ts writes them under
         grimoire-splash-colors), falling back to the default Tome theme. -->
    <div id="app">
      <div id="boot-splash" aria-label="Loading…">
        <img src="/logo.webp" alt="Dungeon Grimoire" />
        <div class="boot-spinner"></div>
      </div>
    </div>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2rem;
        background-color: var(--boot-bg, hsl(40 30% 95%));
        z-index: 9999;
      }
      #boot-splash img {
        max-width: min(30rem, 80vw);
        height: auto;
      }
      #boot-splash .boot-spinner {
        width: 2.5rem;
        height: 2.5rem;
        border: 3px solid color-mix(in oklch, var(--boot-primary, hsl(42 90% 35%)) 25%, transparent);
        border-top-color: var(--boot-primary, hsl(42 90% 35%));
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
    </style>
    <script>
      try {
        var c = JSON.parse(localStorage.getItem("grimoire-splash-colors") || "null");
        if (c && c.background && c.primary) {
          var r = document.documentElement.style;
          r.setProperty("--boot-bg", c.background);
          r.setProperty("--boot-primary", c.primary);
        }
      } catch (e) {
        // Blocked or corrupt storage: the default colours stand.
      }
    </script>

    <!-- Vercel Web Analytics (#645). Loaded as a script rather than via
         @vercel/analytics because every stable release of that package still
         declares a `vue-router@^4` peer and this app is on 5 — the package
         would need a forced override to install, for an integration we would
         not use anyway.

         No cookie and no device storage, so ePrivacy Art. 5(3) never engages
         and this needs no consent banner. Cookieless is the whole reason this
         was chosen over a tool with funnels; see issue #645.

         beforeSend reduces every URL to its route *shape* before it leaves the
         browser. Grimoire's paths carry entity ids (/campaign/<uuid>/npc/<uuid>)
         and its search params carry whatever the user typed, none of which
         belongs in an analytics product — and unreduced ids would fragment the
         report into one row per entity regardless. This mirrors what the Sentry
         integration already does to URLs (#644). -->
    <script>
      window.va =
        window.va ||
        function () {
          (window.vaq = window.vaq || []).push(arguments);
        };
      window.va("beforeSend", function (event) {
        try {
          var url = new URL(event.url);
          return {
            ...event,
            url:
              url.origin +
              url.pathname
                .replace(
                  /\/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}(?=\/|$)/gi,
                  "/:id",
                )
                // Shared-library rows are text ids (srd_owlbear), not uuids.
                .replace(/\/srd_[^/]+(?=\/|$)/gi, "/:id"),
          };
        } catch {
          // An unparseable URL is not worth reporting a shape for.
          return null;
        }
      });
    </script>
    <script defer src="/_vercel/insights/script.js"></script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
