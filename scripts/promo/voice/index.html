<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grimoire voice-over</title>
<style>
  @font-face { font-family: "Alegreya Sans"; font-weight: 400; src: url(/font/alegreya-sans-400.woff2) format("woff2"); }
  @font-face { font-family: "Alegreya Sans"; font-weight: 700; src: url(/font/alegreya-sans-700.woff2) format("woff2"); }
  @font-face { font-family: "Fondamento"; font-weight: 400; src: url(/font/fondamento-400.woff2) format("woff2"); }
  :root {
    --paper: #f2ece0; --card: #f8f4ea; --ink: #2b2019; --muted: #7a6b5a; --line: #d9ceb9;
    --gold: #9a6f1f; --red: #a3321f; --green: #3f6b2f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 18px/1.5 "Alegreya Sans", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); padding: 14px 24px; }
  .bar { max-width: 960px; margin: 0 auto; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
  h1 { font: 400 26px "Fondamento", serif; margin: 0; flex: 1 1 auto; }
  h1 small { display: block; font: 400 15px "Alegreya Sans", sans-serif; color: var(--muted); }
  select, button { font: inherit; color: inherit; }
  select { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; max-width: 280px; }
  .meter { width: 220px; height: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 7px; position: relative; overflow: hidden; }
  .meter i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--green); }
  .meter.hot i { background: var(--gold); }
  .meter.clip i { background: var(--red); }
  .meter-label { font-size: 14px; color: var(--muted); min-width: 130px; }
  .meter-label.clip { color: var(--red); font-weight: 700; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 24px 80px; display: grid; gap: 18px; }
  .keys { color: var(--muted); font-size: 15px; }
  kbd { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 0 6px; font: 600 13px "Alegreya Sans", sans-serif; }
  .shot { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 18px; display: grid; grid-template-columns: 180px 1fr; gap: 22px; opacity: .72; }
  .shot.current { opacity: 1; border-color: var(--gold); box-shadow: 0 0 0 2px rgba(154, 111, 31, .22); }
  .clipbox { position: relative; }
  video.clip { width: 180px; aspect-ratio: 9 / 16; background: #000; border-radius: 8px; display: block; }
  .count { position: absolute; inset: 0; display: none; place-items: center; background: rgba(43, 32, 25, .6); border-radius: 8px; color: #fff; font: 400 96px "Fondamento", serif; }
  .shot.counting .count { display: grid; }
  .num { color: var(--gold); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; }
  .caption { color: var(--muted); margin: 0 0 8px; }
  .caption b { color: var(--ink); font-weight: 700; }
  .narration { font-size: 30px; line-height: 1.4; margin: 6px 0 14px; }
  .meta { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); font-size: 15px; margin-bottom: 12px; }
  .state { font-weight: 700; }
  .state.has { color: var(--green); }
  .state.recording { color: var(--red); }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  button { background: var(--card); border: 1px solid var(--gold); color: var(--gold); border-radius: 6px; padding: 7px 16px; cursor: pointer; font-weight: 700; }
  button.primary { background: var(--gold); color: #fff; }
  button.rec { background: var(--red); border-color: var(--red); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  footer { border-top: 1px solid var(--line); padding-top: 20px; display: grid; gap: 12px; justify-items: start; }
  pre { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; font: 13px/1.5 ui-monospace, monospace; white-space: pre-wrap; max-width: 100%; }
  pre.fail { border-color: var(--red); }
  video.reel { width: 270px; aspect-ratio: 9 / 16; background: #000; border-radius: 8px; }
  .notice { background: var(--card); border: 1px solid var(--red); color: var(--red); border-radius: 8px; padding: 12px 16px; }
  [hidden] { display: none !important; }
  .picker { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .episode { display: grid; gap: 4px; padding: 16px 18px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; color: inherit; text-decoration: none; }
  .episode:hover, .episode:focus-visible { border-color: var(--gold); outline: none; }
  .episode .who { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); }
  .episode strong { font-size: 19px; }
  .episode .progress { color: var(--muted); }
  .episode.done .progress { color: var(--green); }
  .empty { color: var(--muted); }
  @media (max-width: 640px) { .shot { grid-template-columns: 1fr; } .narration { font-size: 24px; } }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1 id="title">Voice-over<small id="subtitle"></small></h1>
    <select id="episode" aria-label="Episode"></select>
    <select id="mic" aria-label="Microphone"></select>
    <div class="meter" id="meter" role="meter" aria-label="Input level"><i id="meter-fill"></i></div>
    <div class="meter-label" id="meter-label">No signal</div>
  </div>
</header>
<main>
  <div id="notice" class="notice" hidden></div>
  <div class="keys" id="keys"><kbd>Space</kbd> record / stop &nbsp; <kbd>Enter</kbd> keep &nbsp; <kbd>R</kbd> retake &nbsp; <kbd>Esc</kbd> cancel &nbsp; <kbd>&larr;</kbd> <kbd>&rarr;</kbd> previous / next shot</div>
  <div id="shots"></div>
  <footer id="footer">
    <button id="assemble" class="primary">Assemble the Reel</button>
    <div id="assemble-status"></div>
    <pre id="assemble-log" hidden></pre>
    <video id="reel" class="reel" controls playsinline hidden></video>
  </footer>
</main>
<script src="/voice.js"></script>
</body>
</html>
