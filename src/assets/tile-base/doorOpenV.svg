<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- OPEN: the SAME slab as doorClosedV, turned 60 degrees on the hinge at
       (256,512). Same length, same thickness, same board-ends, same lever — a
       door standing open is the shut door rotated, and if the two tiles
       disagree about how substantial it is then the reference is telling the
       model two stories.

       The threshold is left clear so the floor shows through. -->
  <defs>
    <linearGradient id="band" x1="0" y1="384" x2="0" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6d6d6d"/><stop offset=".5" stop-color="#8e8e8e"/><stop offset="1" stop-color="#6d6d6d"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="470" x2="0" y2="554" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b9b9b9"/><stop offset=".5" stop-color="#a2a2a2"/><stop offset="1" stop-color="#8a8a8a"/>
    </linearGradient>
    <linearGradient id="reveal" x1="0" y1="384" x2="0" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3f3f3f"/><stop offset=".5" stop-color="#535353"/><stop offset="1" stop-color="#3f3f3f"/>
    </linearGradient>
  </defs>
  <g transform="rotate(90 512 512)">
    <rect x="0" y="384" width="256" height="256" fill="url(#band)"/>
    <rect x="768" y="384" width="256" height="256" fill="url(#band)"/>
    <rect x="244" y="384" width="14" height="256" fill="#000000" opacity=".35"/>
    <rect x="766" y="384" width="14" height="256" fill="#000000" opacity=".35"/>
    <g transform="rotate(60 256 512)">
      <rect x="278" y="486" width="500" height="84" fill="#000000" opacity=".25"/>
      <rect x="262" y="470" width="500" height="84" fill="url(#leaf)" stroke="#1a1a1a" stroke-opacity=".8" stroke-width="5"/>
      <g stroke="#1a1a1a" stroke-opacity=".45" stroke-width="4">
        <path d="M330 470 V554"/><path d="M398 470 V554"/><path d="M466 470 V554"/>
        <path d="M534 470 V554"/><path d="M602 470 V554"/><path d="M670 470 V554"/>
      </g>
      <rect x="262" y="470" width="500" height="9" fill="#ffffff" opacity=".38"/>
      <rect x="262" y="545" width="500" height="9" fill="#000000" opacity=".30"/>
      <rect x="700" y="554" width="46" height="18" rx="7" fill="#3f3f3f" stroke="#1a1a1a" stroke-opacity=".7" stroke-width="3"/>
    </g>
    <g fill="#3c3c3c" stroke="#1a1a1a" stroke-opacity=".85" stroke-width="3">
      <rect x="240" y="478" width="44" height="20" rx="10"/>
      <rect x="240" y="526" width="44" height="20" rx="10"/>
    </g>
  </g>
</svg>
