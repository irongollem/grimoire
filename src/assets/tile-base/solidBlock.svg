<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SOLID BLOCK: the DARK, COARSE member. This is the inside of a wall, and
       its whole job is to be unmistakable against the floor at a glance —
       darker, far larger units, deep joints. Two courses of big offset blocks
       running off every edge: no bounding rectangle, because a rectangle inside
       a square reads as a room outline and cost a generation when it did
       (the model returned a dungeon floor plan).
       Same masonry language as wallSegment, deliberately: a wall and a wall's
       interior are the same substance, and a pack where they are not looks
       wrong wherever a wall ends. -->
  <rect x="0" y="0" width="1024" height="1024" fill="#5d5d5d"/>
  <g stroke="#232323" stroke-width="16" stroke-opacity=".9" fill="none">
    <path d="M0 512 H1024"/>
    <path d="M336 0 V512 M760 0 V512"/>
    <path d="M150 512 V1024 M600 512 V1024"/>
  </g>
  <g fill="#ffffff" fill-opacity=".13">
    <rect x="0" y="24" width="1024" height="10"/>
    <rect x="0" y="536" width="1024" height="10"/>
  </g>
  <g fill="#000000" fill-opacity=".22">
    <rect x="0" y="478" width="1024" height="18"/>
    <rect x="0" y="990" width="1024" height="18"/>
  </g>
</svg>
