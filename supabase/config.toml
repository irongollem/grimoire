# Grimoire — Supabase project config
#
# Only the bits the repo needs to track are declared here. Everything else
# (db ports, studio, auth defaults, storage defaults) is left to the CLI's
# built-in defaults + whatever is configured on the hosted project via the
# Supabase dashboard.
#
# Per-function `supabase/functions/<name>/config.toml` files are NOT read
# by `supabase functions deploy` — those must be declared here at the root.
# Pushes that change this file, migrations, or functions are released by the
# gated production job in `.github/workflows/release.yml`: migrations first, then
# all current Edge Function bundles.

# `supabase functions deploy <name>` needs a project_id (or a --project-ref
# override). Set this to the linked Supabase project's ref. Left as a
# placeholder so a fresh clone doesn't accidentally target a stranger's
# project; each maintainer links locally with
#   supabase link --project-ref <your-ref>
# which updates .supabase/config (gitignored) and lets the CLI resolve
# commands without this string.
project_id = "grimoire"

[db.seed]
enabled = true
sql_paths = ["./seed*.sql"]

# Local only: no log pipeline. `analytics` (Logflare) and the `vector` shipper
# feeding it exist to back Studio's Logs pages, which nothing here uses, and
# together they held ~1.15 GB of a 7.75 GB Docker VM, the largest share of the
# stack. Request counts come from Kong (`docker logs supabase_kong_grimoire`),
# any service's log from `docker logs supabase_<service>_grimoire`, and
# production logs from the hosted project, none of which depend on this.
# Delete these two lines and restart the stack to get Studio's Logs back.
[analytics]
enabled = false

# ── Edge Functions ───────────────────────────────────────────────────────────

# Public ICS feed consumed by players' calendar apps (Google / Apple / Outlook).
# Those clients can't attach a Supabase JWT, so the function has to accept
# unauthenticated requests. Security is enforced by a random per-campaign
# `ical_token` in the URL path (see `ical-feed/index.ts`): the function
# validates the token and only returns CONFIRMED sessions, never private
# DM notes or draft scheduling state.
[functions.ical-feed]
verify_jwt = false

# API key vault encrypt/decrypt endpoint — holds the master VAULT_KEY. Called by
# the browser via the client SDK, which forwards the user's access token in the
# Authorization header, so the gateway JWT check works. The function ALSO does
# its own getUser() + per-blob ownership check (decrypt is scoped to the
# caller's own campaign keys, or platform keys for admins) — defense in depth.
[functions.api-key-vault]
verify_jwt = true

# One-click RSVP for a suggested session date. The recipient is answering from
# a link in an email and may not be signed in — often they are in a phone's mail
# app, which is the whole point — so there is no JWT to check, exactly the
# ical-feed situation. The capability is the random per-invitation token in the
# URL (session_proposal_invites), and the function can only record one
# player's availability for the one date that token names.
# GET renders a confirmation form and POST acts, because link scanners prefetch.
# Reached through the app's /api/rsvp relay, never linked directly: the hosted
# gateway serves an Edge Function's HTML as text/plain (api/_rsvpRelay.ts).
[functions.session-rsvp]
verify_jwt = false

# Inbound iMIP replies — the METHOD:REPLY a player's mail app sends when they
# press Accept on the invitation. Delivered by an inbound-email provider, which
# has no Supabase session, so the gateway check is off and the function checks
# a shared secret (INBOUND_EMAIL_SECRET) itself, refusing everything with 503
# until that secret exists. See session-rsvp-inbound/index.ts for the wiring.
[functions.session-rsvp-inbound]
verify_jwt = false

# In-app bug reporter — called by the browser on behalf of any logged-in user.
# The gateway check is off because we want anonymous reports too (e.g. users
# who can't access their session). Security: the function only creates GitHub
# issues; it never reads or mutates app data. The GitHub token is a
# fine-grained PAT scoped to `issues: write` only, stored encrypted in
# platform_api_keys (provider "github") and managed from the admin panel —
# not a static function secret, since the PAT has a GitHub-side expiry.
[functions.create-bug-report]
verify_jwt = false

# Stripe checkout — requires an authenticated user; gateway check off so the
# function can return a typed JSON error instead of a generic 401 from the
# gateway. The function verifies the JWT manually via supabase.auth.getUser().
[functions.stripe-create-checkout]
verify_jwt = false

# Stripe billing portal — same pattern as checkout.
[functions.stripe-create-portal]
verify_jwt = false

# Stripe webhook — called by Stripe (no user JWT). The function validates
# the Stripe-Signature header with the webhook secret instead.
[functions.stripe-webhook]
verify_jwt = false

# Read-only MCP server — lets a DM connect their own AI (Claude Desktop /
# claude.ai) and look up campaign content by conversation. The gateway check is
# off because the function must (a) serve a public Protected Resource Metadata
# document and (b) answer unauthenticated calls with its own 401 +
# WWW-Authenticate so MCP clients can discover the OAuth server. The function
# validates the Supabase-issued OAuth JWT itself via getUser() and runs every
# query through an RLS-scoped client (see `mcp/index.ts`).
[functions.mcp]
verify_jwt = false

# Shared SRD rules sync — triggered by an admin / cron with the service-role
# key, so the gateway check can stay on.
# [functions.sync-srd-rules]
# verify_jwt = true  (default)

# Simulacrum Meshy job poller — invoked by pg_cron via pg_net (see the
# `poll-meshy-jobs` cron job in
# supabase/migrations/20260718000001_simulacrum_foundations.sql), which has no
# user JWT to forward. The function validates a shared Authorization bearer
# token against SIMULACRUM_POLLER_TOKEN (see poll-meshy-jobs/index.ts).
[functions.poll-meshy-jobs]
verify_jwt = false

# Parent-consent email request (#919). A young player asking a parent to set
# up or approve their account has, by definition, no Grimoire account of
# their own yet — the pure signup-page path has no JWT to send. When the
# caller DOES have a session (an existing account the Terms gate found to be
# under 16, asking a parent to approve it), the function reads the
# Authorization header itself and verifies it manually; it never trusts a
# caller-supplied id. See request-parental-consent/index.ts.
[functions.request-parental-consent]
verify_jwt = false

# ── OAuth 2.1 Server (authorization server for the MCP connector) ─────────────
# Turns Supabase Auth into the OAuth 2.1 + OIDC authorization server that backs
# the MCP connector: it hosts /authorize, /token, JWKS and discovery, and (with
# DCR enabled) lets claude.ai register itself when the DM pastes the MCP URL.
# Access tokens are standard Supabase JWTs, so existing RLS applies unchanged.
# The consent UI lives in the SPA at `authorization_url_path` (see
# /oauth/consent). Currently a Supabase beta feature.
[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true
